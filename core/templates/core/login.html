{% extends "core/base.html" %}
{% block title %}Connexion — AtelierVitre{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="summary-card">
      <h1 class="mb-4">AtelierVitre</h1>
      <h2 class="h4 mb-4">Connexion</h2>

      {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Identifiant</label>
          {{ form.username }}
        </div>
        <div class="mb-4">
          <label class="form-label" for="{{ form.password.id_for_label }}">Mot de passe</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">Se connecter</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
